<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#5c1f2e">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Nouvel An à la Groutte</title>
<style>
  :root {
    --prune: #5c1f2e; --prune-fonce: #3a1220; --or: #d2a45c; --creme: #fdfdfc; --creme-doux: rgba(253, 253, 252, .72);
    --police: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--police); color: var(--creme); line-height: 1.4;
    background: radial-gradient(120% 80% at 50% 0%, var(--prune) 0%, var(--prune-fonce) 100%) fixed, var(--prune-fonce);
    display: flex; align-items: center; justify-content: center;
    padding: calc(32px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo { display: block; margin: 0 auto; width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
  .bientot {
    display: inline-block; margin: 28px 0 10px; padding: 6px 14px; border: 1px solid var(--or); border-radius: 999px;
    color: var(--or); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 40px); line-height: 1.1; letter-spacing: -.01em; }
  .dates { margin: 10px 0 0; color: var(--creme-doux); font-size: 17px; }
  .texte { margin: 24px 0 0; color: var(--creme-doux); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 28px;
    min-height: 52px; padding: 0 20px; border-radius: 14px; background: var(--or); color: #21201c;
    font-size: 17px; font-weight: 700; text-decoration: none; transition: transform .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid var(--creme); outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  .staff { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(253, 253, 252, .16); }
  .staff h2 { margin: 0 0 14px; color: var(--creme-doux); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .staff ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .staff li { padding: 7px 14px; border-radius: 999px; background: rgba(253, 253, 252, .1); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="icone.svg" alt="" width="112" height="112">
  <span class="bientot">Bientôt</span>
  <h1>Nouvel An à la Groutte</h1>
  <p class="dates">du 28 décembre 2026 au 3 janvier 2027</p>
  <p class="texte">L'appli du séjour arrive : inscription, gîte, repas, budget et souvenirs. En attendant, tout se passe sur le Discord.</p>

  <!-- Lien d'invitation du Discord : à remplacer ici. -->
  <a class="btn" href="https://discord.gg/JArDHUPBZ" rel="noopener">
    <svg viewBox="0 0 576 512" aria-hidden="true"><path d="M384 144c0 97.2-86 176-192 176-26.7 0-52.1-5-75.2-14L35.2 349.2c-9.3 4.9-20.7 3.2-28.2-4.2s-9.2-18.9-4.2-28.2l35.6-67.2C14.3 220.2 0 183.6 0 144 0 46.8 86-32 192-32S384 46.8 384 144zm0 368c-94.1 0-172.4-62.1-188.8-144 120-1.5 224.3-86.9 235.8-202.7 83.3 19.2 145 88.3 145 170.7 0 39.6-14.3 76.2-38.4 105.6l35.6 67.2c4.9 9.3 3.2 20.7-4.2 28.2s-18.9 9.2-28.2 4.2L459.2 498c-23.1 9-48.5 14-75.2 14z"/></svg>
    Rejoindre le Discord
  </a>

  <section class="staff">
    <h2>Le staff</h2>
    <ul>
      <li>Mathurin</li>
      <li>Paul</li>
      <li>Joshua</li>
      <li>Jickael</li>
    </ul>
  </section>
</main>
</body>
</html>
