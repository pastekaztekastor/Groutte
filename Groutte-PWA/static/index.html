<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f1f0ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="static/icones/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="static/icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groutte">
<title>Nouvel An à la Groutte</title>
<link rel="stylesheet" href="static/tokens.css">
<link rel="stylesheet" href="static/style.css">
<script>
  /* Mode sombre posé avant l'affichage, sans éclair clair (même règle que appliquerMode dans commun.js). */
  try {
    var mode = localStorage.getItem("groutte-mode");   /* même préfixe que PREFIXE (commun.js) */
    if (mode === "sombre" || (mode !== "clair" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("sombre");
  } catch (e) {}
</script>
</head>
<body>
<!-- Écran poussé (une fiche du carnet, Installer l'appli...) : « Retour » et le titre. -->
<header class="barre-nav" id="barre-nav" hidden>
  <span class="gauche-nav" id="gauche-nav"><a class="retour" id="retour" href="#"></a></span>
  <span class="titre" id="titre-nav"></span>
  <span class="action-nav" id="action-nav"></span>
</header>
<div class="alerte maj" id="alerte-maj" hidden>
  <p><strong>Une nouvelle version de l'appli est en ligne.</strong></p>
  <button type="button" class="btn principal large" id="mettre-a-jour">Mettre à jour</button>
  <p class="petit">Si rien ne change après, refais l'installation : supprime l'appli de l'écran d'accueil, puis réinstalle-la depuis le navigateur.</p>
</div>
<main id="vue"></main>
<!-- Panneau latéral (panneau.js) : sur téléphone, ouvert par la bulle de compte, sur un voile qui le referme ;
     en paysage (900 px et plus), toujours affiché en colonne à gauche. -->
<div class="voile-panneau" id="voile-panneau"></div>
<aside class="panneau-lateral" id="panneau" aria-label="Menu" aria-hidden="true" inert></aside>
<p id="notification" role="status" hidden></p>

<div class="connexion" id="connexion" hidden>
  <h1 id="connexion-titre"></h1>
  <p>Qui es-tu ?</p>
  <div class="choix-compte" id="choix-compte"></div>
</div>
<div class="connexion ecran" id="ecran" hidden></div>
<div class="visionneuse" id="visionneuse" hidden></div>
<div class="voile" id="modale" hidden>
  <div class="feuille" id="modale-contenu"></div>
</div>

<script src="static/js/bandeau-test.js"></script>
<script type="module" src="static/js/main.js"></script>
</body>
</html>
